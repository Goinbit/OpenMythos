name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for debugging.
  workflow_dispatch:

# Cancel stale runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the stack that decides these verdicts, matching the
# canonical local gate env (.venv-arm64). Every job installs from these values and
# then asserts what actually resolved, so "green" cannot silently describe a stack
# nobody measures locally. The advisory benchmark job reads the same block: its
# timings are only comparable if the stack behind them is named. Layers that do not
# decide a verdict (numpy, transformers, datasets, pytest) stay resolved by pip and
# are printed, not pinned.
env:
  GATE_TORCH: "torch==2.12.0"
  GATE_MYPY: "mypy==2.4.1"
  GATE_RUFF: "ruff==0.15.8"

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install runtime deps
        # torch CPU wheel keeps the runner fast and avoids CUDA-only behaviour
        # (SDPA path includes the torch<2.5 fallback verified in this project).
        # transformers/datasets/loguru are required by training/ imports and
        # by the checkpoint-related tests in tests/test_training.py.
        # No numpy pin: the first real CI run showed why. `numpy<2` forces
        # 1.26.4, while pyarrow wheels are Python-version specific — py3.10
        # resolved pyarrow 25 (tolerates numpy 1.x) but py3.12 resolved 26
        # (requires numpy>=2) → ImportError during collection of the three
        # `datasets`-importing test modules, on the 3.12 leg only. Letting pip
        # resolve keeps each leg coherent, and matches the canonical local gate
        # env (.venv-arm64: numpy 2.4.6 + pyarrow 24.0.0 + datasets 4.8.5).
        # torch IS pinned: leaving it loose resolved 2.14.1 (py3.10) and 2.15.0
        # (py3.12) against the canonical gate env's 2.12.0, so the "green" here
        # described a stack nobody measures locally. 2.12.0+cpu ships
        # manylinux x86_64 wheels for both legs, so the pin costs no availability.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "${GATE_TORCH}"
          pip install pytest pytest-timeout "transformers>=4.40.0" "datasets>=2.18.0" "loguru>=0.7.3"

      - name: Assert gate stack
        # Fail before the verdict step if the runner resolved a different torch,
        # so a green here always has version coordinates.
        run: python -m examples.ci_gate_stack "${GATE_TORCH}"

      - name: Show environment
        run: |
          python --version
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          # pyarrow is listed because the numpy/pyarrow wheel fork is what made
          # a leg fail once; the resolved pair is the reproducible coordinate.
          pip list | grep -iE 'torch|numpy|pyarrow|datasets|transformers|loguru|pytest|mypy|ruff'

      - name: Run pytest
        # tests/test_tokenizer.py is excluded because it downloads a HF model
        # on first use and would make CI flaky on network hiccups. The rest
        # (184 tests) run fully offline.
        run: |
          python -W ignore -m pytest tests/ \
            --ignore=tests/test_tokenizer.py \
            --timeout=120 \
            -v --tb=short

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Exact pin: ruff's default rule set expanded in 0.16+ (144 new style
      # hits on this tree), so a range made the gate version-dependent.
      - run: pip install "${GATE_RUFF}"
      - name: Assert gate stack
        run: python -m examples.ci_gate_stack "${GATE_RUFF}"
      - name: ruff check
        # Enforced: lint regressions block PR merge.
        run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install typecheck deps
        # mypy + the runtime deps it needs to trace through torch + training.
        # Matches [tool.mypy] config in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          # Exact pins on BOTH layers that decide this verdict: the mypy version
          # and the torch stub generation. Unpinned torch resolved 2.14.1/2.15.0
          # while the local green was measured on 2.12.0 — under a range, the
          # upstream release cadence decides whether the gate holds.
          pip install --index-url https://download.pytorch.org/whl/cpu "${GATE_TORCH}"
          # No numpy pin — the canonical local gate env (where that green was
          # measured) runs numpy 2.4.6, and pinning numpy<2 there would describe
          # a stack nobody verifies.
          pip install "${GATE_MYPY}"
      - name: Assert gate stack
        # Both layers decide this verdict, so both are checked before it runs.
        run: python -m examples.ci_gate_stack "${GATE_TORCH}" "${GATE_MYPY}"
      - name: mypy
        # Config lives in pyproject.toml; currently passes with 0 errors on
        # main. Enforced (no continue-on-error) so regressions block.
        run: python -m mypy --no-incremental

  benchmark:
    name: gate benchmark (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: CPU timings cannot satisfy the Stage 3 exit gate
    # (that asks for 3B GPU throughput), and runner contention is not a
    # regression signal. Blocking on it would teach people to ignore the red.
    # What the job does own is a record: every trunk push and every PR re-runs
    # the same harness on the same pinned stack, so the next performance PR
    # has a diffable before/after instead of a claim.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "${GATE_TORCH}"
      - name: Assert gate stack
        # Same rule as the verdict jobs, applied to timings: a number printed
        # without its torch version cannot be compared across runs anyway.
        run: python -m examples.ci_gate_stack "${GATE_TORCH}"
      - name: Run gate benchmark
        # Shapes kept small so the job stays a footnote next to the gates.
        run: >-
          python -m benchmarks.gate_bench
          --seq-len 256 --repeat 3 --threads 1 --json gate_bench.json
      - name: Run recurrent benchmark
        run: >-
          python -m benchmarks.recurrent_bench
          --repeat 3 --threads 1 --json recurrent_bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-bench-${{ github.run_id }}
          path: |
            gate_bench.json
            recurrent_bench.json
