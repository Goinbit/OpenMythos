name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for debugging.
  workflow_dispatch:

# Cancel stale runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install runtime deps
        # torch CPU wheel keeps the runner fast and avoids CUDA-only behaviour
        # (SDPA path includes the torch<2.5 fallback verified in this project).
        # transformers/datasets/loguru are required by training/ imports and
        # by the checkpoint-related tests in tests/test_training.py.
        # No numpy pin: the first real CI run showed why. `numpy<2` forces
        # 1.26.4, while pyarrow wheels are Python-version specific — py3.10
        # resolved pyarrow 25 (tolerates numpy 1.x) but py3.12 resolved 26
        # (requires numpy>=2) → ImportError during collection of the three
        # `datasets`-importing test modules, on the 3.12 leg only. Letting pip
        # resolve keeps each leg coherent, and matches the canonical local gate
        # env (.venv-arm64: numpy 2.4.6 + pyarrow 24.0.0 + datasets 4.8.5).
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest pytest-timeout "transformers>=4.40.0" "datasets>=2.18.0" "loguru>=0.7.3"

      - name: Show environment
        run: |
          python --version
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          pip list | grep -iE 'torch|numpy|datasets|transformers|loguru|pytest'

      - name: Run pytest
        # tests/test_tokenizer.py is excluded because it downloads a HF model
        # on first use and would make CI flaky on network hiccups. The rest
        # (184 tests) run fully offline.
        run: |
          python -W ignore -m pytest tests/ \
            --ignore=tests/test_tokenizer.py \
            --timeout=120 \
            -v --tb=short

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Exact pin: ruff's default rule set expanded in 0.16+ (144 new style
      # hits on this tree), so a range made the gate version-dependent.
      - run: pip install 'ruff==0.15.8'
      - name: ruff check
        # Enforced: lint regressions block PR merge.
        run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install typecheck deps
        # mypy + the runtime deps it needs to trace through torch + training.
        # Matches [tool.mypy] config in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # Exact pin: whether an ignore is "used" depends on mypy+torch stub
          # versions; verified green at mypy 2.4.1 + torch 2.12.0. No numpy pin
          # — the canonical local gate env (where that green was measured) runs
          # numpy 2.4.6, and pinning numpy<2 there would describe a stack nobody
          # verifies.
          pip install 'mypy==2.4.1'
      - name: mypy
        # Config lives in pyproject.toml; currently passes with 0 errors on
        # main. Enforced (no continue-on-error) so regressions block.
        run: python -m mypy --no-incremental
